defaults:
  lookback_days: 2
  top_n: 18
  timezone: Asia/Shanghai
  stale_days: 21
  boost_keywords:
    - agent
    - agents
    - openai
    - anthropic
    - gemini
    - deepseek
    - reasoning
    - model
    - paper
    - benchmark
    - coding
    - inference
    - workflow
    - release
  promotion_keywords:
    - webinar
    - sponsored
    - partner content
    - register now
    - save up
    - ticket
    - event

sources:
  - id: techcrunch-ai
    name: TechCrunch AI
    enabled: true
    mode: auto
    ingestion_mode: direct_feed
    parser: rss
    group: foreign_media
    bucket_hint: hot_news
    trust_tier: high
    promotional_risk: medium
    url: https://techcrunch.com/category/artificial-intelligence/
    feed_url: https://techcrunch.com/category/artificial-intelligence/feed/
    weight: 10
    notes: Primary foreign AI news feed.

