defaults:
  lookback_days: 2
  top_n: 18
  timezone: Asia/Shanghai
  stale_days: 21
  boost_keywords:
    - agent
    - agents
    - openai
    - anthropic
    - gemini
    - deepseek
    - reasoning
    - model
    - paper
    - benchmark
    - coding
    - inference
    - workflow
    - release
  promotion_keywords:
    - webinar
    - sponsored
    - partner content
    - register now
    - save up
    - ticket
    - event

