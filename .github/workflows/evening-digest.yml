name: Evening AI Digest

on:
  schedule:
    # GitHub Actions cron 用 UTC；Asia/Shanghai 19:40 = UTC 11:40
    - cron: "40 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      ZHIPU_MODEL: glm-4.7-flash
      DIGEST_PROFILE: evening
      DIGEST_TZ: Asia/Shanghai
      DIGEST_MORNING_POST_TIME: "06:00:00"
      DIGEST_EVENING_POST_TIME: "19:40:00"
      DIGEST_LLM_MAX_CONCURRENCY: "1"
      DIGEST_LLM_MIN_INTERVAL_MS: "35000"
      DIGEST_LLM_INTERVAL_JITTER_MS: "600"
      DIGEST_LLM_MAX_RETRIES: "3"
      DIGEST_TIMEOUT_ZHIPU_MS: "240000"
      DIGEST_LLM_CACHE_RETENTION_DAYS: "45"
      DIGEST_TOPIC_MERGE_BATCH_SIZE: "60"
      DIGEST_CLUSTER_INPUT_CAP_PAPERS: "60"
      DIGEST_CLUSTER_INPUT_CAP: "150"
      DIGEST_CLUSTER_BATCH_SIZE: "25"
      DIGEST_TOPIC_MIN_NEWS: "3"
      DIGEST_CLUSTER_NEWS_PER_SOURCE_CAP: "10"
      DIGEST_CI_MAX_ATTEMPTS: "3"
      DIGEST_CI_RETRY_BASE_DELAY_MS: "60000"
      DIGEST_CI_RETRY_MAX_DELAY_MS: "240000"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Resolve digest run metadata
        id: digest_meta
        run: |
          # 晚报窗口是当天 06:00-19:40；cron 常延迟到次日 00:xx-05:xx 才启动，
          # 此时若仍取当天日期，窗口还没开始、候选全被过滤成 0 条。
          # 凌晨 6 点前启动一律算前一天的晚报。
          SH_HOUR="$(TZ="${DIGEST_TZ:-Asia/Shanghai}" date +%H)"
          if [ "$SH_HOUR" -lt 6 ]; then
            DIGEST_DATE="$(TZ="${DIGEST_TZ:-Asia/Shanghai}" date -d "yesterday" +%F)"
          else
            DIGEST_DATE="$(TZ="${DIGEST_TZ:-Asia/Shanghai}" date +%F)"
          fi
          echo "date=${DIGEST_DATE}" >> "$GITHUB_OUTPUT"
          echo "path=source/_posts/evening-digest-${DIGEST_DATE}.md" >> "$GITHUB_OUTPUT"
          echo "reports_dir=data/digest-reports/evening/${DIGEST_DATE}" >> "$GITHUB_OUTPUT"

      - name: Run digest
        env:
          DIGEST_DATE: ${{ steps.digest_meta.outputs.date }}
          DIGEST_PROFILE: evening
          DIGEST_EDITION: evening
        run: npm run digest:ci

      - name: Verify digest output
        run: |
          DIGEST_PATH="${{ steps.digest_meta.outputs.path }}"
          if [ ! -s "$DIGEST_PATH" ]; then
            echo "::error::Digest output missing or empty: ${DIGEST_PATH}"
            echo "Current post files for resolved date:"
            find source/_posts -maxdepth 1 -type f -name "*digest-${{ steps.digest_meta.outputs.date }}.md" -print | sort
            git status --short
            exit 1
          fi

      - name: Upload digest diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evening-digest-debug-${{ steps.digest_meta.outputs.date }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ steps.digest_meta.outputs.reports_dir }}
            data/digest-cache.json
            ${{ steps.digest_meta.outputs.path }}

      - name: Commit digest + cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DIGEST_PATH="${{ steps.digest_meta.outputs.path }}"
          if [ -f "$DIGEST_PATH" ]; then
            git add "$DIGEST_PATH"
          else
            echo "Digest file not found for ${DIGEST_PATH}; skip file add."
          fi
          if [ -d "${{ steps.digest_meta.outputs.reports_dir }}" ]; then
            git add "${{ steps.digest_meta.outputs.reports_dir }}"
          fi
          if [ -f "data/digest-cache.json" ]; then
            git add data/digest-cache.json
          else
            echo "::warning::digest-cache.json not found; skipping cache commit"
          fi

          unexpected_deletes="$(git diff --cached --name-status | awk '$1=="D" && $2 ~ /^source\/_posts\// && $2 !~ /^source\/_posts\/(digest|evening-digest)-[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$/ {print $2}')"
          if [ -n "$unexpected_deletes" ]; then
            echo "::error::Unsafe deletion detected under source/_posts (non-digest files):"
            echo "$unexpected_deletes"
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update evening digest"
            git pull --rebase origin main
            git push
          fi

      - name: Build Hexo
        run: npx hexo clean && npx hexo generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
